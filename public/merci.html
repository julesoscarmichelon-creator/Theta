<link rel="stylesheet" href="/assets/theta.css">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#17150F',
          panel: '#211E16',
          panelCard: '#1C1A13',
          ink: '#F7F4EC',
          gold: '#D4A93B',
          goldLight: '#F0D585',
        }
      }
    }
  };
</script>
<style>
  body{background:#17150F; color:#F7F4EC; font-family:'Inter',sans-serif;}
  ::selection{ background:#D4A93B; color:#17150F; }
  .font-display{ font-family:'Space Grotesk','Inter',sans-serif; text-wrap:balance; }
  .hairline{ border-color:rgba(247,244,236,0.08); }

  a:focus-visible, button:focus-visible{
    outline: 2px solid #D4A93B;
    outline-offset: 3px;
    border-radius: 4px;
  }

  .btn-gold{
    background:#C9A227; color:#0B0B0A;
    transition: transform .25s ease, background .2s ease;
  }
  .btn-gold:hover{ background:#DDB93E; transform:translateY(-2px); }
  .btn-gold:active{ transform:translateY(0) scale(0.98); }

  .btn-ghost{
    border:1px solid rgba(245,243,238,0.2);
    transition: border-color .2s ease, background .2s ease, transform .2s ease;
  }
  .btn-ghost:hover{ border-color:rgba(245,243,238,0.5); background:rgba(245,243,238,0.04); }
  .btn-ghost:active{ transform:scale(0.98); }

  /* Coche de validation animée au chargement (~0,7 s au total).
     Le cercle se trace via stroke-dashoffset, puis la coche s'écrit. */
  .check-anim{
    animation: ca-pop .45s cubic-bezier(.22,1,.36,1) both;
  }
  .ca-ring{
    stroke-dasharray: 208;            /* circonférence : 2 x PI x 33 ≈ 207,3 */
    stroke-dashoffset: 208;
    transform: rotate(-90deg);        /* départ du tracé en haut du cercle */
    transform-origin: 50% 50%;
    animation: ca-ring-draw .55s cubic-bezier(.22,1,.36,1) forwards;
  }
  .ca-tick{
    stroke-dasharray: 42;             /* longueur du chemin de la coche ≈ 40,5 */
    stroke-dashoffset: 42;
    animation: ca-tick-draw .3s cubic-bezier(.22,1,.36,1) .38s forwards;
  }
  @keyframes ca-pop{
    from{ opacity: 0; transform: scale(.86); }
    to  { opacity: 1; transform: scale(1); }
  }
  @keyframes ca-ring-draw{ to{ stroke-dashoffset: 0; } }
  @keyframes ca-tick-draw{ to{ stroke-dashoffset: 0; } }

  /* Rendu final immédiat si l'utilisateur limite les animations. */
  @media (prefers-reduced-motion: reduce){
    .check-anim, .ca-ring, .ca-tick{ animation: none !important; }
    .ca-ring, .ca-tick{ stroke-dashoffset: 0 !important; }
  }

</style>
</head>
<body class="antialiased selection:bg-gold selection:text-bg">


<main class="relative z-10 min-h-[100dvh] flex items-center justify-center px-6 py-16">
  <div class="w-full max-w-lg text-center">

    <a href="index.html" class="inline-flex items-center gap-2 text-lg font-medium tracking-tight font-display mb-12">
      <span class="text-gold font-bold text-xl">Θ</span>
      <span class="font-semibold">Theta</span>
    </a>

    <div class="flex justify-center mb-8">
      <svg class="check-anim" width="72" height="72" viewBox="0 0 72 72" fill="none" role="img" aria-label="Demande confirmée">
        <circle class="ca-ring" cx="36" cy="36" r="33" stroke="#34d399" stroke-width="2.5"/>
        <path class="ca-tick" d="M23 37.5 L32.5 47 L49.5 26" stroke="#34d399" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="font-display text-2xl sm:text-4xl font-light tracking-tight mb-5">
      Merci, votre demande est <span class="font-medium text-gold">bien enregistrée.</span>
    </h1>

    <p class="text-sm sm:text-base text-ink/60 leading-relaxed mb-10">
      Nous confirmons votre créneau sous 24 heures, par e-mail ou par SMS.
      Vous n'avez rien d'autre à faire d'ici là.
    </p>

    <a href="index.html" class="btn-ghost inline-block text-sm font-medium px-7 py-3.5 rounded-lg">
      Retour au site
    </a>

  </div>
</main>

<footer class="relative z-10 border-t hairline">
  <div class="max-w-6xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-ink/40 font-mono">
    <div class="flex items-center gap-2"><span class="text-gold font-bold">Θ</span> Theta — Automatisation globale</div>
    <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2">
      <a href="mentions-legales.html" class="hover:text-ink transition-colors">Mentions légales</a>
      <a href="politique-confidentialite.html" class="hover:text-ink transition-colors">Confidentialité</a>
      <span>© 2026 Theta. France.</span>
    </div>
  </div>
</footer>

</body>
</html>
