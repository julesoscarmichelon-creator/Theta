<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace privé — Michelon &amp; Co</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230F172A'/%3E%3Crect x='30' y='44' width='40' height='30' rx='6' fill='%23FAFAFA'/%3E%3Cpath d='M38 44v-8a12 12 0 0124 0v8' stroke='%23FAFAFA' stroke-width='6' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/michelon-ds.css">
<style>
  /* ====================================================================
     ESPACE PRIVÉ
     Mêmes jetons que le site (couleurs, typographie, rythme), mais un
     traitement délibérément distinct : bandeau sombre permanent, fond en
     retrait, aucune navigation du site. On doit voir au premier coup d'œil
     qu'on n'est plus sur les pages publiques.
     ==================================================================== */
  body{ background: var(--c-bg-sunken); min-height: 100vh; }

  .bar{
    background: var(--c-ink); color: #fff;
    padding: var(--sp-4) var(--sp-6);
    display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap;
  }
  .bar__brand{
    font-family: var(--f-display); font-weight: 700; font-size: .95rem;
    letter-spacing: .09em; text-transform: uppercase;
  }
  .bar__tag{
    font-size: .68rem; letter-spacing: var(--ls-eyebrow); text-transform: uppercase;
    border: 1px solid rgba(255,255,255,.3); border-radius: var(--r-pill);
    padding: .28rem .7rem; color: rgba(255,255,255,.75);
  }
  .bar__spacer{ flex: 1 1 auto; }
  .bar__btn{
    font: 600 .72rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase;
    color: rgba(255,255,255,.8); background: transparent; cursor: pointer;
    border: 1px solid rgba(255,255,255,.25); border-radius: var(--r-pill);
    padding: .5rem 1rem;
    transition: background var(--dur-fast) linear, color var(--dur-fast) linear;
  }
  .bar__btn:hover{ background: rgba(255,255,255,.1); color: #fff; }

  .wrap{ max-width: 860px; margin: 0 auto; padding: var(--sp-12) var(--sp-6) var(--sp-24); }

  /* ---- Connexion --------------------------------------------------- */
  .gate{ max-width: 26rem; margin: var(--sp-24) auto; }
  .gate__card{
    background: var(--c-surface); border: 1px solid var(--c-line);
    border-radius: var(--r-lg); padding: var(--sp-8); box-shadow: var(--sh-sm);
  }
  .gate h1{ font-family: var(--f-display); font-size: 1.35rem; letter-spacing: .04em;
            margin: 0 0 var(--sp-2); color: var(--c-ink); }
  .gate p{ margin: 0 0 var(--sp-6); color: var(--c-ink-muted); font-size: var(--t-sm); }

  /* ---- En-tête de liste -------------------------------------------- */
  .head{ display: flex; align-items: baseline; gap: var(--sp-4); flex-wrap: wrap;
         margin-bottom: var(--sp-8); }
  .head h1{ font-family: var(--f-display); font-size: var(--t-h2); letter-spacing: .04em;
            margin: 0; color: var(--c-ink); }
  .head__count{ font: 500 var(--t-sm)/1 var(--f-mono); color: var(--c-ink-muted); }

  .tools{ display: flex; gap: var(--sp-3); margin-bottom: var(--sp-8); flex-wrap: wrap; }
  .tools .ds-field{ flex: 1 1 16rem; }
  .tools button{
    font: 600 .72rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase;
    background: var(--c-surface); color: var(--c-ink-muted); cursor: pointer;
    border: 1px solid var(--c-line-strong); border-radius: var(--r-md); padding: 0 1.1rem;
    transition: border-color var(--dur-fast) linear, color var(--dur-fast) linear;
  }
  .tools button:hover{ border-color: var(--c-ink); color: var(--c-ink); }

  /* ---- Demandes ----------------------------------------------------- */
  .item{
    background: var(--c-surface); border: 1px solid var(--c-line);
    border-radius: var(--r-md); padding: var(--sp-6); margin-bottom: var(--sp-4);
    box-shadow: var(--sh-xs);
  }
  .item__top{ display: flex; align-items: baseline; gap: var(--sp-4);
              flex-wrap: wrap; margin-bottom: var(--sp-2); }
  .item__nom{ font-family: var(--f-display); font-size: 1.05rem; letter-spacing: .03em;
              color: var(--c-ink); }
  .item__soc{ font-size: var(--t-sm); color: var(--c-ink-muted); }
  .item__date{ margin-left: auto; font: 400 var(--t-xs)/1 var(--f-mono);
               color: var(--c-ink-faint); white-space: nowrap; }
  .item__mail{ font-size: var(--t-sm); color: var(--c-accent-deep); text-decoration: none;
               word-break: break-all; }
  .item__mail:hover{ text-decoration: underline; }
  .item__msg{
    white-space: pre-wrap; overflow-wrap: anywhere;
    margin: var(--sp-4) 0 0; padding: var(--sp-4);
    background: var(--c-bg-sunken); border-radius: var(--r-sm);
    font-size: var(--t-sm); color: var(--c-ink-body);
  }
  .item__meta{ margin: var(--sp-4) 0 0; font: 400 var(--t-xs)/1.5 var(--f-mono);
               color: var(--c-ink-faint); word-break: break-all; }

  .notice{
    padding: var(--sp-5) var(--sp-6); border-radius: var(--r-md);
    border: 1px solid var(--c-line-strong); background: var(--c-surface);
    font-size: var(--t-sm); color: var(--c-ink-body); margin-bottom: var(--sp-6);
  }
  .notice--warn{ border-color: rgba(180,83,9,.3); background: rgba(217,119,6,.06); color: #B45309; }
  .notice--error{ border-color: rgba(185,28,28,.28); background: rgba(220,38,38,.05); color: #B91C1C; }
  .empty{ text-align: center; color: var(--c-ink-muted); padding: var(--sp-24) 0;
          font-size: var(--t-sm); }

  .foot{ margin-top: var(--sp-12); font-size: var(--t-xs); color: var(--c-ink-faint); }
  .foot a{ color: inherit; }
</style>
</head>
<body>

<header class="bar">
  <span class="bar__brand">Michelon &amp; Co</span>
  <span class="bar__tag">Espace privé</span>
  <span class="bar__spacer"></span>
  <button class="bar__btn" type="button" id="logout" hidden>Se déconnecter</button>
</header>

<!-- ===================== CONNEXION ===================== -->
<section class="gate" id="gate" hidden>
  <div class="gate__card">
    <h1>Accès réservé</h1>
    <p>Cet espace regroupe les demandes reçues par le formulaire du site.</p>
    <form id="loginForm">
      <input class="ds-field" type="password" id="password" name="password"
             placeholder="Mot de passe" autocomplete="current-password" required>
      <button class="ds-btn ds-btn--solid" type="submit" style="margin-top:var(--sp-4);width:100%">
        Entrer
      </button>
    </form>
    <p class="notice notice--error" id="loginError" hidden
       role="alert" style="margin:var(--sp-4) 0 0"></p>
  </div>
</section>

<!-- ===================== LISTE ===================== -->
<main class="wrap" id="board" hidden>
  <div class="head">
    <h1>Demandes reçues</h1>
    <span class="head__count" id="count"></span>
  </div>

  <p class="notice notice--warn" id="storageWarning" hidden></p>
  <p class="notice notice--error" id="boardError" hidden role="alert"></p>

  <div class="tools">
    <input class="ds-field" type="search" id="search" placeholder="Filtrer par nom, e-mail, message…">
    <button type="button" id="refresh">Actualiser</button>
  </div>

  <div id="list"></div>

  <p class="foot">
    Espace privé — non référencé, non accessible depuis le site.
    <a href="/">Retour au site</a>
  </p>
</main>

<script src="/assets/admin.js" defer></script>
</body>
</html>
