<title>API de contact — Michelon &amp; Co</title>
<style>
  :root{ color-scheme: light dark; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center;

        background:#FAFAFA; color:#0F172A; padding:2rem; }
  main{ max-width:34rem; }
  h1{ font-size:1.1rem; margin:0 0 .75rem; }
  p{ margin:0 0 .75rem; color:#475569; }
  code{ font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.9em;
        background:rgba(15,23,42,.06); padding:.15em .4em; border-radius:5px; }
  @media (prefers-color-scheme: dark){
    body{ background:#0F172A; color:#F1F5F9; } p{ color:#94A3B8; }
    code{ background:rgba(255,255,255,.1); }
  }
</style>
</head>
<body>
<main>
  <h1>API de contact</h1>
  <p>Ce service reçoit les formulaires de contact et les relaie par e-mail.

  <p>Envoi : <code>POST /api/contact</code> — état du service :
     <code><a href="/api/health">/api/health</a></code>.</p>
</main>
