<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Connexion — Administration Theta</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div class="login">
  <form id="loginForm" autocomplete="on">
    <h1>Administration</h1>
    <p class="meta" style="margin:6px 0 20px">Consultation des demandes reçues par le formulaire de contact.</p>

    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" autofocus>

    <p id="error" class="notice error hidden" role="alert"></p>

    <button class="primary" type="submit" id="submit">Se connecter</button>
  </form>
</div>

<script>
(function () {
  'use strict';

  var form = document.getElementById('loginForm');
  var field = document.getElementById('password');
  var error = document.getElementById('error');
  var submit = document.getElementById('submit');

  // Session déjà ouverte : on évite de redemander le mot de passe.
  fetch('/api/session', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) { if (data && data.authenticated) go(); })
    .catch(function () { /* la page de connexion reste affichée */ });

  function go() { window.location.replace('/submissions.html'); }

  function fail(message) {
    error.textContent = message;
    error.classList.remove('hidden');
    field.select();
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    error.classList.add('hidden');
    submit.disabled = true;
    submit.textContent = 'Connexion…';

    fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: field.value })
    }).then(function (res) {
      if (res.ok) return go();
      return res.json().catch(function () { return {}; }).then(function (data) {
        fail(data.error || 'Connexion impossible.');
      });
    }).catch(function () {
      fail('Serveur injoignable. Réessayez dans un instant.');
    }).finally(function () {
      submit.disabled = false;
      submit.textContent = 'Se connecter';
    });
  });
})();
</script>
</body>
</html>
